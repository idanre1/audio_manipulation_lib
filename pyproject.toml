[project]
name = "audio-manipulation-lib"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = [
    "beat-this==1.1.0",
    "soundfile",
    "torch==2.5.1",
    "torchaudio==2.5.1",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
